<main class="checkout-page container"><div class="intro"><span class="eyebrow">CARTIFY / CHECKOUT</span><h1>Complete your order.</h1><p>Enter your delivery details and we’ll take care of the rest.</p></div><div class="checkout-layout"><form class="form-card" [formGroup]="form" (ngSubmit)="submit()"><label>Full name<input formControlName="full_name" placeholder="Your full name"></label><label>Phone<input formControlName="phone" placeholder="01xxxxxxxxx"></label><label>Address<textarea formControlName="address" rows="4" placeholder="Street, building and apartment"></textarea></label><label>City<input formControlName="city" placeholder="Cairo"></label>@if(error){<div class="error">{{error}}</div>}<button class="submit" type="submit" [disabled]="loading() || form.invalid">{{loading() ? 'PLACING ORDER…' : 'PLACE ORDER →'}}</button></form><aside><span class="eyebrow">SECURE CHECKOUT</span><h2>Ready when you are.</h2><p>Your cart items will be converted into an order using the current prices and stock.</p><a routerLink="/cart">← BACK TO BAG</a></aside></div></main>
