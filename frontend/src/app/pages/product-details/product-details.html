<section class="detail container">@if(loading()){<div class="loading">Loading…</div>}@else if(product(); as p){<a routerLink="/products" class="back">← Back to store</a><div class="layout"><div class="image"><img [src]="p.image || 'https://images.unsplash.com/photo-1523275335684-37898b6baf30'" [alt]="p.name"></div><div class="info"><div class="topline"><small>{{p.brand}}</small><button class="wishlist" type="button" (click)="toggleWishlist()">{{wishlist.isSaved(p.id) ? '♥ Saved' : '♡ Wishlist'}}</button></div><h1>{{p.name}}</h1><div class="rating">★ {{p.rating}} / 5</div><p>{{p.description}}</p><div class="price">EGP {{p.price | number}}</div>@if(p.old_price){<del>EGP {{p.old_price | number}}</del>}<div class="buy"><input type="number" min="1" [max]="p.stock" [(ngModel)]="quantity"><button (click)="add()" [disabled]="p.stock===0">{{p.stock?'Add to Cart':'Out of Stock'}}</button></div>@if(message){<div class="message">{{message}}</div>}<span class="stock">{{p.stock}} items available</span></div></div>}</section>
