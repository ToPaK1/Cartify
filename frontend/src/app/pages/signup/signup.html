<section class="auth-page"><div class="auth-card"><span class="eyebrow">JOIN CARTIFY</span><h1>Create your account</h1><p>Start shopping with a faster, simpler experience.</p>@if(error){<div class="error">{{error}}</div>}<form [formGroup]="form" (ngSubmit)="submit()"><label>Full name<input formControlName="name" placeholder="Your name"></label><label>Email<input type="email" formControlName="email" placeholder="you@example.com"></label><label>Phone<input formControlName="phone" placeholder="01xxxxxxxxx"></label><label>Password<div class="password"><input [type]="show?'text':'password'" formControlName="password" placeholder="At least 6 characters"><button type="button" (click)="show=!show">{{show?'Hide':'Show'}}</button></div></label><button class="submit" [disabled]="loading">{{loading?'Creating…':'Create Account'}}</button></form><div class="switch">Already have an account? <a routerLink="/login">Sign in</a></div></div></section>
