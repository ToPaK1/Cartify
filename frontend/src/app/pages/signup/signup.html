<section class="auth-page"><div class="auth-visual"><div class="visual-copy"><span class="eyebrow">CARTIFY / MEMBERS</span><h2>Make it<br>yours.</h2><p>Create an account to save your bag, follow your orders and make every next visit easier.</p></div></div><div class="auth-panel"><div class="auth-card"><span class="eyebrow">JOIN CARTIFY</span><h1>Create account.</h1><p>A simpler way to shop the things you love.</p>@if(error){<div class="error">{{error}}</div>}<form [formGroup]="form" (ngSubmit)="submit()"><label>Full name<input formControlName="name" placeholder="Your full name" autocomplete="name"></label><label>Email<input type="email" formControlName="email" placeholder="you@example.com" autocomplete="email"></label><label>Phone<input type="tel" formControlName="phone" placeholder="01xxxxxxxxx" autocomplete="tel"></label><label>Password<div class="password"><input [type]="show?'text':'password'" formControlName="password" placeholder="At least 6 characters" autocomplete="new-password"><button type="button" (click)="show=!show">{{show?'Hide':'Show'}}</button></div></label><button class="submit" type="submit" [disabled]="loading || form.invalid">{{loading?'Creating…':'Create Account →'}}</button></form><div class="switch">Already have an account? <a routerLink="/login">Sign in</a></div></div></div></section>
