<section class="section container"><div class="heading"><div><span class="eyebrow">CARTIFY STORE</span><h1>All products</h1></div><span>{{products().length}} items</span></div><div class="toolbar"><input [(ngModel)]="search" (keyup.enter)="apply()" placeholder="Search products…"><select [(ngModel)]="sort" (change)="apply()"><option value="newest">Newest</option><option value="price_asc">Price: low to high</option><option value="price_desc">Price: high to low</option><option value="rating">Top rated</option></select><button (click)="apply()">Search</button></div>@if(loading()){<div class="loading">Loading products…</div>}@else if(error()){<div class="error">{{error()}}</div>}@else{<div class="grid">@for(product of products();track product.id){<a class="card" [routerLink]="['/products',product.id]"><div class="pic"><img [src]="product.image || 'https://images.unsplash.com/photo-1523275335684-37898b6baf30'" [alt]="product.name"></div><small>{{product.brand}}</small><h3>{{product.name}}</h3><div class="rating">★ {{product.rating}}</div><strong>EGP {{product.price | number}}</strong></a>}</div><div class="pagination"><button (click)="prev()" [disabled]="page===1">←</button><span>Page {{page}} / {{pages}}</span><button (click)="next()" [disabled]="page===pages">→</button></div>}</section>
