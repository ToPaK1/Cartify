<section class="auth-page"><div class="auth-card"><span class="eyebrow">WELCOME BACK</span><h1>Sign in to Cartify</h1><p>Continue your shopping journey.</p>@if(error){<div class="error">{{error}}</div>}<form [formGroup]="form" (ngSubmit)="submit()"><label>Email<input type="email" formControlName="email" placeholder="you@example.com"></label><label>Password<div class="password"><input [type]="show?'text':'password'" formControlName="password" placeholder="••••••••"><button type="button" (click)="show=!show">{{show?'Hide':'Show'}}</button></div></label><button class="submit" [disabled]="loading">{{loading?'Signing in…':'Sign In'}}</button></form><div class="switch">New to Cartify? <a routerLink="/signup">Create an account</a></div></div></section>
