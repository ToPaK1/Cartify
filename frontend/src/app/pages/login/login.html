<section class="auth-page"><div class="auth-visual"><div class="visual-copy"><span class="eyebrow">CARTIFY / MEMBERS</span><h2>Good things<br>are waiting.</h2><p>Sign in to keep your bag, orders and wishlist together in one place.</p></div></div><div class="auth-panel"><div class="auth-card"><span class="eyebrow">WELCOME BACK</span><h1>Sign in.</h1><p>Continue your Cartify experience.</p>@if(error){<div class="error">{{error}}</div>}<form [formGroup]="form" (ngSubmit)="submit()"><label>Email<input type="email" formControlName="email" placeholder="you@example.com" autocomplete="email"></label><label>Password<div class="password"><input [type]="show?'text':'password'" formControlName="password" placeholder="Your password" autocomplete="current-password"><button type="button" (click)="show=!show">{{show?'Hide':'Show'}}</button></div></label><button class="submit" type="submit" [disabled]="loading || form.invalid">{{loading?'Signing in…':'Sign In →'}}</button></form><div class="switch">New to Cartify? <a routerLink="/signup">Create an account</a></div></div></div></section>
